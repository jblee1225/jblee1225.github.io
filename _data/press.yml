  outlets_note: 외 다수
  summary: |
    한국표준과학연구원(KRISS)은 5월 12일부터 14일까지 사흘간 제주에서 Emerging Scientist Workshop 2026(이하 'ESW')을 개최했다. ESW는 각국의 측정표준기관인 KRISS(한국), NIM\*(중국), NMIJ\*\*(일본)의 신진 연구자들이 한자리에 모여, 측정표준 분야 연구 현황을 공유하고 글로벌 연구 협력의 기반을 다지기 위해 마련된 워크숍이다. 2015년 KRISS의 제안으로 시작된 이후 3국이 매년 번갈아 주최해 왔으며, 2024년 중국 NIM, 2025년 일본 NMIJ에 이어 올해는 KRISS가 다시 주최를 맡았다. 출범 이후 열 번째로 열린 이번 워크숍은 사실상 ESW가 본격적인 성숙기에 접어들었음을 보여주는 자리이기도 했다.

    KRISS에서는 물리측정본부 비파괴측정그룹의 이재범 박사가 구두 발표자로 선정되어, "자율 지능형 측정의 미래(Toward Autonomous Intelligent Measurement)"를 주제로 발표를 진행했다. 이재범 박사는 측정 시스템에 인공지능과 자율성이 결합되었을 때 측정과학이 어떻게 진화할 수 있을지에 대해 공유하며, 참석자들의 활발한 질의응답을 이끌어냈다.

    \* NIM: National Institute of Metrology, 중국 국가측정표준대표기관 &nbsp;&nbsp; \*\* NMIJ: National Metrology Institute of Japan, 일본 국가측정표준대표기관

- title: "KRISS, 과기부 장관배 출연(연) 사이언스컵 축구대회 준우승"
  date: 2024-06-27
  images:
    - file: press-2024-06-science-cup-team.jpg
      caption: "2024 과학기술정보통신부 장관배 출연(연) 사이언스컵 시상식"
    - file: press-2024-06-science-cup-cheer.jpg
      caption: "경기장을 찾은 응원단"
  outlets:
    - 표준연
  summary: |
    KRISS 축구단은 출연연, NST, 과기부를 포함해 총 23개 기관이 출전한 이번 대회의 첫 경기에서 한국기초과학지원연구원을 9:1 대승으로 물리친 후 한국원자력연구원, 한국핵융합에너지연구원을 꺾으며 파죽지세로 결승까지 오르게 되었다. 결승전까지 실점은 단 2점뿐이었다.

    결승전 경기는 KRISS 가스측정그룹 이환 선임기술원의 어시스트에 이은 비파괴측정그룹 이재범 선임연구원의 선제골로 기분 좋게 시작했지만, 안타깝게도 전반전에 역전을 허용했고 2:1로 후반전을 맞이했다. 경기 흐름을 바꿔보고자 선수교체를 진행했지만 1골을 더 실점해 3:1로 아쉽게도 준우승에 만족해야 했다.

- title: "센서 하나로 충분하다 … 원전 지진 피해 예측 인공지능 기술 개발"
  date: 2025-09-30
  images:
    - file: press-2025-09-virtual-sensor-kbs.jpg
      caption: "KBS 뉴스 보도 영상 캡처"
    - file: press-2025-09-virtual-sensor-ytn.jpg
      caption: "YTN 사이언스 투데이 보도 영상 캡처"
  outlets:
    - KBS
    - YTN 사이언스투데이
    - 동아일보
    - 연합뉴스
    - 한국일보
  outlets_note: 외 다수
  summary: |
    UNIST 지구환경도시건설공학과 이영주 교수팀과 한국표준과학연구원 물리측정본부 비파괴측정그룹 이재범 박사팀은 원자력발전소 보조 건물 내 139개 세부 지점의 진동 현황을 추정하는 인공지능 모델을 개발했다고 30일 밝혔다.

    개발된 인공지능 모델은 단일 센서가 실측한 지진 데이터를 입력받아 건물 내 139개 지점의 지진 가속도 응답을 0.07초 안에 산출해 낸다. 가속도 응답은 지진파가 지나갈 때 설비가 얼마나 빠르고 세게 흔들렸는지를 보여주는 지표로 이를 분석해 어느 구역에 설치된 설비를 우선 점검해야 하는지를 파악할 수 있다.

    연구팀은 "원전 점검으로 인해 가동이 중단되는 시간과 센서 유지·보수 부담을 획기적으로 줄인 기술"이라며 "특히 원전과 같은 방사선 통제구역에서는 센서 설치와 유지보수가 매우 제한적이고 비용이 많이 드는데, 이러한 문제를 근본적으로 해결할 수 있을 것으로 기대된다"고 말했다.

    이번 연구는 국제적으로도 그 우수성을 인정받았다. 제1저자인 이진구 연구원이 이번 성과로 제28회 원자로 구조역학 국제학회(SMiRT)의 젊은 연구자상(Shibata Award) 부문에 입선(honorable mention)한 것이다. SMiRT(Structural Mechanics in Reactor Technology)는 원자로 구조 및 내진 분야의 권위 학회로, 올해 학회는 8월 10일부터 15일까지 캐나다 토론토에서 열렸다.

- title: "UNIST 박사 13명, 독립 연구자로 … 세종과학펠로우십 선정"
  date: 2021-03-07
  images:
    - file: press-2021-03-sejong-fellowship.jpg
      caption: "세종과학펠로우십에 선정된 이재범 박사"
  outlets:
    - 헬로디디
    - 뉴스1
    - 뉴시스
    - 부산일보
    - 경상일보
    - 울산매일TV
    - 울산제일일보
  outlets_note: 외 다수
  summary: |
    UNIST(울산과학기술원) 소속 연구자 13명이 과학기술정보통신부와 한국연구재단이 지원하는 '2021년 기초연구사업 세종과학펠로우십'에 선정됐다.

    7일 UNIST에 따르면 최근 발표된 '2021 기초연구사업 세종과학펠로우십' 최종 선정명단에 이재범 박사를 포함한 UNIST 소속 연구자 13명이 포함됐다. 이들은 향후 최대 5년간 매년 약 1억 3000만 원의 연구비 지원을 받으며 독립적인 연구를 수행하게 된다.

    이번 과제 선정의 기쁨을 안은 이재범 박사는 UNIST 도시환경공학과 이영주 교수 연구실에서 박사후연구원으로 근무하고 있다.

    이재범 박사는 "지금까지는 지도교수님이 만들어주신 온실 속에서 연구를 진행했다면, 이제는 독립적인 연구자로서 새로운 도전에 나서고 싶었다"며 "박사후연구원의 연구를 장려하는 사업이 생겼다는 소식에 바로 지원을 준비했다"고 말했다.

    지원 사업에 선정된 이 박사는 '디지털 트윈(Digital Twin)'과 심층강화학습을 활용해 주요 시설물의 수명을 예측하는 기술 개발에 나선다. 교량, 건물 등 도시의 대형 구조물에 센서를 부착해 특성을 파악하고, 이를 가상세계에 그대로 구현해 수명과 위험도 등을 예측하는 것이 핵심이다. 궁극적으로는 인공지능(AI)을 접목해 스스로 정확도를 높일 수 있는 시스템을 구축하는 게 목표다.

    이재범 박사는 "도시에 발생하는 재난은 사람들에게 미치는 영향력이 크기 때문에 이를 관리할 수 있는 기술개발의 필요성은 점차 높아지고 있다"며 "재난관리공학과 인공지능기술을 융합한 연구의 가능성을 인정받은 만큼 사회에 필요한 연구를 계속해나가고 싶다"고 소감을 전했다.
