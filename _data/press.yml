- title: '"표준, 첨단산업의 핵심" … 표준연, 세계 측정의 날 기념 행사'
  date: 2026-05-20
  images:
    - file: press-2026-05-metrology-day.jpg
      caption: "2026년 세계 측정의 날 유공자 표창 (한국표준과학연구원 원장상)"
  outlets:
    - 세계경제
    - 아시아경제
    - 금강일보
    - 디지털타임스
    - 헬로디디
    - 국방일보
  outlets_note: 외 다수
  summary: |
    한국표준과학연구원(KRISS)이 '세계 측정의 날(World Metrology Day)'을 맞아 측정표준의 사회적 역할과 정책 신뢰의 중요성을 조명하는 기념행사를 개최했다.

    KRISS는 20일 원내에서 '측정표준: 정책의 신뢰를 쌓는 초석(Metrology: Building Trust in Policy Making)'을 주제로 세계 측정의 날 기념행사를 열었다고 밝혔다. … 표준연 원장 표창은 △정인지 선임연구원(측정표준 발전 유공) △이재범 선임연구원(측정과학기술 발전 유공) △정윤희 선임기술원(측정표준 보급 유공) △오영광 공군 제85정밀표준정비창 전자군무주무관(측정표준 보급 유공) △최동진 환경공단 대리(중소기업 지원 유공)에게 돌아갔다.

- title: "한중일 측정표준 차세대 리더 협력 기반 마련 … AI 기반 인류 공통 과제 해결 모색"
  date: 2026-05-13
  images:
    - file: press-2026-05-esw-group.jpg
      caption: "ESW 2026에 참석한 한중일 신진 연구자 단체 사진"
    - file: press-2026-05-esw-talk.jpg
      caption: "Selected Oral Presentation에서 발표 중인 이재범 박사"
  outlets:
    - 서울경제
    - 쿠키뉴스
    - 신소재경제신문
    - etnews
    - 지디넷코리아
    - 표준연
  outlets_note: 외 다수
  summary: |
    한국표준과학연구원(KRISS)은 5월 12일부터 14일까지 사흘간 제주에서 Emerging Scientist Workshop 2026(이하 'ESW')을 개최했다. ESW는 각국의 측정표준기관인 KRISS(한국), NIM\*(중국), NMIJ\*\*(일본)의 신진 연구자들이 한자리에 모여, 측정표준 분야 연구 현황을 공유하고 글로벌 연구 협력의 기반을 다지기 위해 마련된 워크숍이다. 2015년 KRISS의 제안으로 시작된 이후 3국이 매년 번갈아 주최해 왔으며, 2024년 중국 NIM, 2025년 일본 NMIJ에 이어 올해는 KRISS가 다시 주최를 맡았다. 출범 이후 열 번째로 열린 이번 워크숍은 사실상 ESW가 본격적인 성숙기에 접어들었음을 보여주는 자리이기도 했다.

    KRISS에서는 물리측정본부 비파괴측정그룹의 이재범 박사가 구두 발표자로 선정되어, "자율 지능형 측정의 미래(Toward Autonomous Intelligent Measurement)"를 주제로 발표를 진행했다. 이재범 박사는 측정 시스템에 인공지능과 자율성이 결합되었을 때 측정과학이 어떻게 진화할 수 있을지에 대해 공유하며, 참석자들의 활발한 질의응답을 이끌어냈다.

    \* NIM: National Institute of Metrology, 중국 국가측정표준대표기관 &nbsp;&nbsp; \*\* NMIJ: National Metrology Institute of Japan, 일본 국가측정표준대표기관

- title: "UNIST 박사 13명, 독립 연구자로 … 세종과학펠로우십 선정"
  date: 2021-03-07
  images:
    - file: press-2021-03-sejong-fellowship.jpg
      caption: "세종과학펠로우십에 선정된 이재범 박사"
  outlets:
    - 헬로디디
    - 뉴스1
    - 뉴시스
    - 부산일보
    - 경상일보
    - 울산매일TV
    - 울산제일일보
  outlets_note: 외 다수
  summary: |
    UNIST(울산과학기술원) 소속 연구자 13명이 과학기술정보통신부와 한국연구재단이 지원하는 '2021년 기초연구사업 세종과학펠로우십'에 선정됐다.

    7일 UNIST에 따르면 최근 발표된 '2021 기초연구사업 세종과학펠로우십' 최종 선정명단에 이재범 박사를 포함한 UNIST 소속 연구자 13명이 포함됐다. 이들은 향후 최대 5년간 매년 약 1억 3000만 원의 연구비 지원을 받으며 독립적인 연구를 수행하게 된다. … 이번 과제 선정의 기쁨을 안은 이재범 박사는 UNIST 도시환경공학과 이영주 교수 연구실에서 박사후연구원으로 근무하고 있다.

    이재범 박사는 "지금까지는 지도교수님이 만들어주신 온실 속에서 연구를 진행했다면, 이제는 독립적인 연구자로서 새로운 도전에 나서고 싶었다"며 "박사후연구원의 연구를 장려하는 사업이 생겼다는 소식에 바로 지원을 준비했다"고 말했다.

    지원 사업에 선정된 이 박사는 '디지털 트윈(Digital Twin)'과 심층강화학습을 활용해 주요 시설물의 수명을 예측하는 기술 개발에 나선다. 교량, 건물 등 도시의 대형 구조물에 센서를 부착해 특성을 파악하고, 이를 가상세계에 그대로 구현해 수명과 위험도 등을 예측하는 것이 핵심이다. 궁극적으로는 인공지능(AI)을 접목해 스스로 정확도를 높일 수 있는 시스템을 구축하는 게 목표다.

    이재범 박사는 "도시에 발생하는 재난은 사람들에게 미치는 영향력이 크기 때문에 이를 관리할 수 있는 기술개발의 필요성은 점차 높아지고 있다"며 "재난관리공학과 인공지능기술을 융합한 연구의 가능성을 인정받은 만큼 사회에 필요한 연구를 계속해나가고 싶다"고 소감을 전했다.
