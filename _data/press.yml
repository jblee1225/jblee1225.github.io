- title: "UNIST 박사 13명, 독립 연구자로 … 세종과학펠로우십 선정"
  date: 2021-03-07
  image: press-2021-03-sejong-fellowship.jpg
  caption: "세종과학펠로우십에 선정된 이재범 박사 (사진 제공: UNIST)"
  outlets:
    - 헬로디디
    - 뉴스1
    - 뉴시스
    - 부산일보
    - 경상일보
    - 울산매일TV
    - 울산제일일보
  outlets_note: 외 다수
  summary: |
    UNIST(울산과학기술원) 소속 연구자 13명이 과학기술정보통신부와 한국연구재단이 지원하는 '2021년 기초연구사업 세종과학펠로우십'에 선정됐다.

    7일 UNIST에 따르면 최근 발표된 '2021 기초연구사업 세종과학펠로우십' 최종 선정명단에 이재범 박사를 포함한 UNIST 소속 연구자 13명이 포함됐다. 이들은 향후 최대 5년간 매년 약 1억 3000만 원의 연구비 지원을 받으며 독립적인 연구를 수행하게 된다. 이번 과제 선정의 기쁨을 안은 이재범 박사는 UNIST 도시환경공학과 이영주 교수 연구실에서 박사후연구원으로 근무하고 있다.

    이재범 박사는 "지금까지는 지도교수님이 만들어주신 온실 속에서 연구를 진행했다면, 이제는 독립적인 연구자로서 새로운 도전에 나서고 싶었다"며 "박사후연구원의 연구를 장려하는 사업이 생겼다는 소식에 바로 지원을 준비했다"고 말했다.

    지원 사업에 선정된 이 박사는 '디지털 트윈(Digital Twin)'과 심층강화학습을 활용해 주요 시설물의 수명을 예측하는 기술 개발에 나선다. 교량, 건물 등 도시의 대형 구조물에 센서를 부착해 특성을 파악하고, 이를 가상세계에 그대로 구현해 수명과 위험도 등을 예측하는 것이 핵심이다. 궁극적으로는 인공지능(AI)을 접목해 스스로 정확도를 높일 수 있는 시스템을 구축하는 게 목표다.

    이재범 박사는 "도시에 발생하는 재난은 사람들에게 미치는 영향력이 크기 때문에 이를 관리할 수 있는 기술개발의 필요성은 점차 높아지고 있다"며 "재난관리공학과 인공지능기술을 융합한 연구의 가능성을 인정받은 만큼 사회에 필요한 연구를 계속해나가고 싶다"고 소감을 전했다.
