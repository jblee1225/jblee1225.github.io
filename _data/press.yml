- title: '"지진 후 어디부터 점검할까" … 표준연, 원전 점검 우선순위 알려주는 AI 모델 개발'
  date: 2026-08-26
  images:
    - file: press-2026-08-seismic-priority-lab.jpg
      caption: "연구팀이 축소 구조물에 대한 가진 실험을 수행하고 있다"
    - file: press-2026-08-seismic-priority-ytn.jpg
      caption: "YTN 사이언스 투데이 보도 영상 캡처"
  outlets:
    - YTN 사이언스투데이
    - 연합뉴스
    - 서울경제
    - 표준연
  outlets_note: 외 다수
  summary: |
    한국표준과학연구원은 이재범 박사 연구팀은 이영주 울산과학기술원(UNIST) 교수 연구팀(제1저자: 이진구 학생연구원)과 공동으로 지진계 신호만으로 원전 내부의 흔들림을 실시간 예측하고, 위험 가능성을 정량화할 수 있는 인공지능(AI) 모델을 개발했다고 26일 밝혔다.

    지진이 발생하면 시설에 큰 피해가 없더라도 안전 확인을 위한 점검 과정에서 장기간 가동이 중단될 수 있다. 실제 2016년 경주지진 당시 월성원전 1~4호기는 성능시험과 정밀점검을 거쳐 약 80일 뒤 재가동됐다.

    하지만 지진 직후 어느 설비를 우선 점검해야 하는지 판단할 정보가 제한적이라 파악이 쉽지 않다. 원전 주요 지점마다 센서를 설치하기에는 배선과 인허가, 유지보수 등의 제약이 있고, 전산 해석 방식은 결과를 얻기까지 시간이 오래 걸린다.

    KRISS 연구진은 이를 보완하기 위해 한 대의 지진계에서 측정한 지진파를 인공지능(AI)으로 분석해 센서가 설치되지 않은 원전 내부 139개 지점의 진동응답을 추정하는 가상센싱 기술을 개발했다. 학습 과정에 포함되지 않은 실제 지진 기록에서도 예측 성능을 확인했다.

    또 구조물마다 가진 고유한 진동 특성인 고유진동수(Natural Frequency)를 바탕으로 구조물에 적합한 AI 구조를 설계하는 방법도 개발했다. 이를 통해 반복적인 AI 모델 설계과정을 줄였으며 개발된 초경량 AI는 최신 대형 딥러닝 모델보다 파라미터 수가 200분의 1 수준이면서도 동등한 수준의 정확도를 확보했다.

    연구진은 해당 기술을 원전뿐 아니라 반도체 공장, 데이터센터, 플랜트 등 지진에 민감한 산업시설에도 적용할 수 있을 것으로 봤다.

    이재범 KRISS 선임연구원은 "안전 분야 AI는 정확한 예측뿐 아니라 판단의 한계를 인식하는 것이 중요하다"며 "이를 바탕으로 불확실한 상황을 알려 사람의 추가 판단을 돕는 신뢰할 수 있는 AI 기술을 개발하겠다"고 말했다.

